<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prava imtihoniga tayyorgarlik</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1f2a37;--mute:#64748b;--line:#d3dbe5;--blue:#1b8fe8;--blued:#0f6fba;--green:#4cc400;--greend:#3a9600;--red:#e5483d;--redbg:#fde9e7;--okbg:#e4f6d8;--selbg:#e3f1fd;--yel:#f5b800;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a22;--card:#1a2631;--ink:#e8eef4;--mute:#97a6b5;--line:#2b3a48;--redbg:#3b1e1c;--okbg:#1d3416;--selbg:#16314a}}
:root[data-theme="dark"]{--bg:#111a22;--card:#1a2631;--ink:#e8eef4;--mute:#97a6b5;--line:#2b3a48;--redbg:#3b1e1c;--okbg:#1d3416;--selbg:#16314a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.5rem;margin:6px 0 14px;font-weight:800}
h2{font-size:1.1rem;margin:22px 0 10px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px 14px;text-align:left;font-weight:700;min-height:64px;display:flex;align-items:center;gap:10px;width:100%}
.tile:active{transform:translateY(2px);border-bottom-width:3px}
.tile small{display:block;font-weight:400;color:var(--mute);font-size:.85rem}
.tile.wide{grid-column:1/-1}
.tile.green{background:var(--green);border-color:var(--greend);color:#fff}
.tile.green small{color:#fff;opacity:.9}
.badge{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;border-radius:12px;font-size:.8rem;padding:1px 8px}
.ic{font-size:1.4rem;line-height:1}
.stats{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px 16px}
.stats .big{font-size:2.2rem;font-weight:800;line-height:1}
.nums{display:flex;gap:14px;font-weight:700}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 0}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:.95rem}
.link{background:none;border:0;color:var(--blue);padding:8px 0;font-weight:700}
.star{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--yel);padding:4px 8px}
.lang{display:flex;gap:6px;margin:0 0 12px}
.lang button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px;font-weight:700;color:var(--mute)}
.lang button.on{border-color:var(--blue);color:var(--blue)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;margin:2px -4px 4px;scrollbar-width:none}
.nav.wrap{flex-wrap:wrap;overflow:visible}
.nb{flex:0 0 auto;min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:700}
.nb.cur{outline:3px solid var(--blue);outline-offset:1px}
.nb.sel{background:var(--selbg);border-color:var(--blue)}
.nb.ok{background:var(--green);border-color:var(--greend);color:#fff}
.nb.bad{background:var(--red);border-color:#b8352b;color:#fff}
.q{font-size:1.2rem;font-weight:700;line-height:1.35;margin:8px 0 14px}
.qw{position:relative;margin:0 0 16px}
.qi{width:100%;border-radius:16px;display:block}
.lg{position:absolute;top:8px;left:8px;width:72px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ph{border:2px dashed var(--line);border-radius:16px;padding:28px 12px;text-align:center;color:var(--mute);margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt i{font-style:normal;font-weight:800;font-size:1.3rem}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--blue);background:var(--selbg)}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.ok i{color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--redbg)}
.opt.bad i{color:var(--red)}
.why{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card);border-left:6px solid var(--yel)}
.why b{display:block}
.cta{margin-top:14px;width:100%;background:var(--green);border:0;border-bottom:5px solid var(--greend);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.05rem}
.cta.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.score{font-size:3.4rem;font-weight:800;line-height:1;margin:8px 0}
.pass{color:var(--greend)}.fail{color:var(--red)}
.list{display:grid;gap:10px}
.empty{color:var(--mute);padding:20px 4px}
.seg{display:flex;background:var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:10px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--blue)}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prow .bar{flex:1;margin:0}
.prow .bar i{background:var(--blue)}
.rst{border:0;background:var(--redbg);color:var(--red);border-radius:14px;width:44px;height:44px;font-size:1.3rem}
.tk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tc b{font-size:.95rem}
.tc span{font-size:.9rem;color:var(--mute)}
.tc.fin{background:var(--green);border-color:var(--greend);color:#fff}
.tc.fin span{color:#fff}
.tc:disabled{opacity:.5;cursor:default}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.ov[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh b.hd{display:block;font-size:1.2rem;margin-bottom:12px}
.sh .link{width:100%;margin-top:6px}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;gap:10px;background:var(--bg);padding:8px 14px;max-width:560px;margin:0 auto}
#bar[hidden]{display:none}
#hb{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;width:44px;height:44px;font-size:1.3rem}
#bar b{font-weight:800}
.dr{justify-content:flex-start;align-items:stretch}
.dn{background:var(--card);width:min(84vw,330px);height:100%;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px}
.ms{font-size:.75rem;letter-spacing:.08em;color:var(--mute);margin:16px 10px 4px;font-weight:800;text-transform:uppercase}
.mi{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:0;background:none;width:100%;text-align:left;font-weight:700}
.mi.on{background:linear-gradient(90deg,#1fe07a,#f2d400);color:#0b1a12}
.dn .seg{margin:10px 0 0}
.dn .lang{margin:12px 0 0}
@media (prefers-reduced-motion:reduce){.tile:active{transform:none}}

.in{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
textarea.in{resize:vertical}
.fb{margin:0 0 14px}.fb label{display:block;font-weight:700;margin-bottom:6px}.fb small{color:var(--mute);font-weight:400}
.orow{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}.orow input[type=radio]{margin-top:14px;width:20px;height:20px}
.row2{display:flex;gap:10px}.row2 .cta{margin-top:0}
.pill{display:inline-block;background:var(--selbg);color:var(--blue);border-radius:10px;padding:2px 10px;font-size:.85rem;font-weight:700}
.mini{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700}
.mini.del{color:var(--red)}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--mute);margin-bottom:14px;cursor:pointer}
.aux{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.role{display:inline-block;background:var(--selbg);color:var(--blue);padding:4px 12px;border-radius:12px;font-weight:700;margin:2px 10px 6px}
.pv{max-width:100%;border-radius:12px;display:block;margin-bottom:8px}
</style>
</head>

<header id="bar"><button id="hb" data-act="menu" aria-label="Menu">☰</button><b id="ttl"></b></header>

<script>
// ====== SAVOLLAR: shu yerda tahrirlang yoki yangi savol qo‘shing ======
// t = mavzu, q = savol, o = variantlar, a = to‘g‘ri javob indeksi (0 dan), e = izoh
var QUESTIONS=[
{t:"Svetofor",q:"Svetoforning qizil signalida haydovchi nima qilishi kerak?",o:["To‘xtash chizig‘i oldida to‘xtashi","Tezlikni pasaytirib o‘tib ketishi","Faqat o‘ngga burilishi mumkin"],a:0,e:"Qizil signal harakatni taqiqlaydi. To‘xtash chizig‘i bo‘lmasa, svetofor oldida to‘xtash kerak."},
{t:"Svetofor",q:"Sariq signal yonganda qanday harakat qilinadi?",o:["Tezlikni oshirib o‘tib olinadi","To‘xtash chizig‘i oldida to‘xtash kerak; keskin tormozlashsiz to‘xtay olmasa, o‘tishi mumkin","Signal yashil bo‘lguncha harakat davom ettiriladi"],a:1,e:"Sariq signal signal almashishi haqida ogohlantiradi va harakatni taqiqlaydi. Faqat xavfsiz to‘xtay olmaydigan haydovchi o‘tishi mumkin."},
{t:"Svetofor",q:"Tartibga soluvchining ko‘rsatmasi svetofor signaliga zid bo‘lsa, kimga amal qilinadi?",o:["Svetoforga","Tartibga soluvchiga","Yo‘l belgilariga qarab o‘zi hal qiladi"],a:1,e:"Tartibga soluvchining ko‘rsatmalari svetofor signallari va yo‘l belgilaridan ustun turadi."},
{t:"Belgilar",q:"Qizil hoshiyali dumaloq yo‘l belgilari nimani bildiradi?",o:["Ogohlantirish","Taqiqlash","Majburiy yo‘nalish"],a:1,e:"Taqiqlovchi belgilar qizil hoshiyali dumaloq shaklda bo‘ladi."},
{t:"Belgilar",q:"Qizil hoshiyali uchburchak belgilar nimadan ogohlantiradi?",o:["Xavfli yo‘l qismi haqida","Harakat taqiqlanganini","Parkovka joyi borligini"],a:0,e:"Ogohlantiruvchi belgilar xavfli joydan oldin o‘rnatiladi va tezlikni pasaytirishga chorlaydi."},
{t:"Belgilar",q:"Ko‘k rangli dumaloq belgilar nimani bildiradi?",o:["Harakatga ruxsat berilgan joy","Majburiy harakat yo‘nalishi yoki tartibi","Xizmat ko‘rsatish joyi"],a:1,e:"Buyuruvchi belgilar ko‘k fonda bo‘lib, ko‘rsatilgan yo‘nalish yoki tartibga amal qilishni talab qiladi."},
{t:"Belgilar",q:"“STOP” belgisi oldida haydovchi nima qiladi?",o:["Tezlikni pasaytirib, yo‘l bo‘shligini ko‘rib o‘tadi","To‘xtash chizig‘i oldida to‘liq to‘xtaydi va asosiy yo‘ldagilarga yo‘l beradi","Faqat yo‘lda piyoda bo‘lsa to‘xtaydi"],a:1,e:"“STOP” belgisida transport vositasi to‘liq to‘xtashi shart, harakatni faqat xavfsiz bo‘lganda davom ettiradi."},
{t:"Belgilar",q:"Teskari uchburchak shaklidagi “Yo‘l bering” belgisi nimani bildiradi?",o:["Asosiy yo‘ldagi transport vositalariga yo‘l berish kerak","Har doim to‘liq to‘xtash kerak","Quvib o‘tish taqiqlangan"],a:0,e:"Bu belgi bilan haydovchi kesishmada asosiy yo‘ldan kelayotganlarga yo‘l berishi shart."},
{t:"Umumiy qoidalar",q:"Burilish ko‘rsatkichi qachon yoqiladi?",o:["Burilish boshlanganda","Manevr boshlanishidan oldin","Faqat chorrahada"],a:1,e:"Signal manevrdan oldin beriladi, shunda boshqa ishtirokchilar vaqtida tayyorlanadi."},
{t:"Umumiy qoidalar",q:"Tartibga solinmagan piyodalar o‘tish joyiga yaqinlashganda piyoda yo‘lni kesib o‘tayotgan bo‘lsa nima qilinadi?",o:["Ovozli signal berib o‘tib ketiladi","To‘xtab, piyodaga yo‘l beriladi","Piyodaning orqasidan aylanib o‘tiladi"],a:1,e:"Piyodalar o‘tish joyida piyodalar ustunlikka ega. Ularga to‘sqinlik qilmaslik shart."},
{t:"Umumiy qoidalar",q:"Piyodalar o‘tish joylarida quvib o‘tish mumkinmi?",o:["Mumkin, agar yo‘l bo‘sh bo‘lsa","Mumkin emas","Faqat kunduzi mumkin"],a:1,e:"Piyodalar o‘tish joylarida va ulardan oldin quvib o‘tish taqiqlanadi."},
{t:"Umumiy qoidalar",q:"Aholi punktlarida ovozli signal qachon beriladi?",o:["Doim, yo‘lni bo‘shatish uchun","Faqat yo‘l-transport hodisasining oldini olish uchun","Faqat kechasi"],a:1,e:"Aholi punktida ovozli signal faqat hodisani oldini olish zarur bo‘lganda beriladi."},
{t:"Umumiy qoidalar",q:"Temir yo‘l o‘tish joyida shlagbaum yopilayotgan bo‘lsa nima qilinadi?",o:["Tezroq o‘tib olishga harakat qilinadi","Shlagbaumni aylanib o‘tiladi","O‘tish taqiqlanadi, to‘xtab kutiladi"],a:2,e:"Shlagbaum yopilayotgan yoki yopiq bo‘lsa, svetofor signalidan qat’i nazar, o‘tish taqiqlanadi."},
{t:"Xavfsizlik",q:"Harakatlanayotganda xavfsizlik kamari kimlar uchun majburiy?",o:["Faqat haydovchi uchun","Haydovchi va old o‘rindiqdagi yo‘lovchi uchun","Kamar bilan jihozlangan o‘rindiqlardagi barcha uchun"],a:2,e:"Haydovchi ham, yo‘lovchilar ham kamar bilan jihozlangan o‘rindiqlarda kamarni taqishi shart."},
{t:"Xavfsizlik",q:"Spirtli ichimlik ichgan holda transport vositasini boshqarish mumkinmi?",o:["Oz miqdorda mumkin","Mumkin emas","Dam olgandan 1 soat keyin mumkin"],a:1,e:"Mast holatda transport vositasini boshqarish qat’iyan taqiqlanadi. Alkogol reaksiya va diqqatni pasaytiradi."},
{t:"Xavfsizlik",q:"Yo‘lda majburiy to‘xtab qolganda nima qilinadi?",o:["Avariya signali yoqiladi va ogohlantiruvchi uchburchak qo‘yiladi","Faqat chiroqlar o‘chiriladi","Hech narsa qilinmaydi, mashinada kutiladi"],a:0,e:"Boshqa haydovchilarni ogohlantirish uchun avariya signali va ogohlantiruvchi uchburchak ishlatiladi."},
