name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/java/uz/autogo/prava app/src/main/assets app/src/main/res/mipmap-xxxhdpi
          mv MainActivity.java app/src/main/java/uz/autogo/prava/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
          mv app-build.gradle app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: prava-beta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
